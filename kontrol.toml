[build.default]
foundry-project-root       = '.'
regen                      = true
rekompile                  = true
verbose                    = false
debug                      = false
require                    = 'verification/kontrol/octant-lemmas.k'
module-import              = ['YDStrategyTest:OCTANT-LEMMAS', 'YSStrategyTest:OCTANT-LEMMAS', 'YFTest:OCTANT-LEMMAS', 'SYFTest:OCTANT-LEMMAS']
auxiliary-lemmas           = true

[prove.default]
foundry-project-root       = '.'
schedule                   = 'PRAGUE'
verbose                    = false
debug                      = false
max-depth                  = 100000
max-iterations             = 10000
reinit                     = false
cse                        = false
workers                    = 1
max-frontier-parallel      = 6
maintenance-rate           = 128
assume-defined             = false
no-log-succ-rewrites       = true
no-stack-checks            = true
optimize-kcfg              = true
kore-rpc-command           = 'kore-rpc-booster --no-post-exec-simplify --equation-max-recursion 20 --equation-max-iterations 1000 --fallback-on Aborted'
failure-information        = true
counterexample-information = true
minimize-proofs            = false
fail-fast                  = true
smt-timeout                = 60000
smt-retry-limit            = 0
break-every-step           = false
break-on-jumpi             = false
break-on-calls             = false
break-on-storage           = false
break-on-basic-blocks      = false
break-on-cheatcodes        = false
auto_abstract              = true
run-constructor            = false
match-test                 = [
        # ============================================
        # YieldDonating strategy proofs (7 inherited + 4 unique = 11)
        # ============================================
        # Inherited from StrategyBaseTest
        "YDStrategyTest.testTend()",
        "YDStrategyTest.testReportOnlyKeeper()",
        "YDStrategyTest.testReportByManagement()",
        "YDStrategyTest.testShutdownBlocks(address)",
        "YDStrategyTest.testBalanceBounded(address)",
        "YDStrategyTest.testReportNoChange()",
        "YDStrategyTest.testReportLossNoBurning()",
        # YD-unique
        "YDStrategyTest.testReportProfit()",
        "YDStrategyTest.testReportLossInsufficientDragon()",
        "YDStrategyTest.testSharesRedeemableAfterDepositYD(uint256,address)",
        "YDStrategyTest.testConversionConsistencyYD(uint256)",
        # ============================================
        # YieldSkimming strategy proofs (4 inherited + 11 unique = 15)
        # ============================================
        # Inherited from StrategyBaseTest (overridden for debt assertions)
        "YSStrategyTest.testTend()",
        "YSStrategyTest.testReportNoChange()",
        "YSStrategyTest.testReportLossNoBurning()",
        "YSStrategyTest.testReportByManagement()",
        # YS-unique
        "YSStrategyTest.testReportProfitYS()",
        "YSStrategyTest.testReportLossWithBurningYS()",
        "YSStrategyTest.testReportLossInsufficientDragonYS()",
        "YSStrategyTest.testDepositBlockedDuringInsolvency()",
        "YSStrategyTest.testDragonBlockedDuringInsolvency()",
        "YSStrategyTest.testDepositBlockedForDragon()",
        "YSStrategyTest.testDepositValueDebtYS(uint256,address)",
        "YSStrategyTest.testTransferDragonToUser(address,uint256)",
        "YSStrategyTest.testTransferUserToDragon(address,uint256)",
        "YSStrategyTest.testConversionSolventYS(uint256)",
        "YSStrategyTest.testConversionFallbackInsolventYS(uint256)",
        # ============================================
        # YieldForwarder proofs (7)
        # ============================================
        "YFTest.testReportAndForwardOnlyKeeper()",
        "YFTest.testReportAndForwardReceiverGuarantee()",
        "YFTest.testReportAndForwardNoResidualShares()",
        "YFTest.testReportAndForwardZeroSharesPassthrough()",
        "YFTest.testReportAndForwardZeroMaxRedeemPassthrough()",
        "YFTest.testReportAndForwardZeroAssetsPassthrough()",
        "YFTest.testReportAndForwardReturnsRedeemAssets()",
        # ============================================
        # SwappingYieldForwarder proofs (9)
        # ============================================
        "SYFTest.testReportSwapAndForwardOnlyKeeper()",
        "SYFTest.testReportSwapAndForwardReceiverGuarantee()",
        "SYFTest.testReportSwapAndForwardNoResidualSourceAsset()",
        "SYFTest.testReportSwapAndForwardZeroSharesPassthrough()",
        "SYFTest.testReportSwapAndForwardZeroRedeemPassthrough()",
        "SYFTest.testReportSwapAndForwardZeroMaxRedeemPassthrough()",
        "SYFTest.testReportSwapAndForwardZeroAssetsPassthrough()",
        "SYFTest.testReportSwapAndForwardCorrectTokenRouting()",
        "SYFTest.testInheritedReportAndForwardAccessControl()",
    ]

[show.default]
foundry-project-root       = '.'
verbose                    = false
debug                      = false
