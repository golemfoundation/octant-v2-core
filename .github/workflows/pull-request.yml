# In steps following image build we're ignoring files uploaded to /_w/ directory as current code is in /app directory

name: 🤖 CI Pull Request
on:
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: "pr-${{ github.sha }}"
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and test
    uses: ./.github/workflows/tpl-lint.yml
    with:
      GCP_DOCKER_IMAGE_REGISTRY: ${{ vars.GCP_DOCKER_IMAGE_REGISTRY }}
    secrets: inherit

  build:
    name: Build
    runs-on: general
    container:
      image: ${{ vars.GCP_DOCKER_IMAGE_REGISTRY }}/node-extended:f4f41461
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Build
        run: yarn build

  test:
    name: Test suite
    runs-on: general
    container:
      image: ${{ vars.GCP_DOCKER_IMAGE_REGISTRY }}/node-extended:f4f41461
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Run tests
        env:
          TEST_RPC_URL: "${{ vars.TEST_MAINNET_RPC_URL }}"
          TEST_SAFE_SINGLETON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
          TEST_RPC_URL_POLYGON: "${{ vars.TEST_POLYGON_RPC_URL }}"
          TEST_SAFE_SINGLETON_POLYGON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY_POLYGON: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
        run: yarn test:ci

      - name: Upload test artifact
        uses: actions/upload-artifact@v4 # upload test results
        if: success() || failure() # run this step even if previous step failed
        with:
          name: test-results
          path: reports/junit.xml

      - name: Prepare test report
        uses: dorny/test-reporter@v2
        if: success() || failure() # run this step even if previous step failed
        continue-on-error: true
        with:
          artifact: test-results # artifact name
          name: Tests results # Name of the check run which will be created
          path: "*.xml" # Path to test results (inside artifact .zip)
          reporter: java-junit # Format of test results

  coverage:
    name: Code Coverage
    runs-on: general
    container:
      image: ${{ vars.GCP_DOCKER_IMAGE_REGISTRY }}/node-extended:f4f41461
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Generate Coverage Report
        env:
          TEST_RPC_URL: "${{ vars.TEST_MAINNET_RPC_URL }}"
          TEST_SAFE_SINGLETON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
          TEST_RPC_URL_POLYGON: "${{ vars.TEST_POLYGON_RPC_URL }}"
          TEST_SAFE_SINGLETON_POLYGON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY_POLYGON: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
        run: |
          # Create markdown report header
          echo "# Code Coverage Report for src/ files" > src_coverage.md
          echo "" >> src_coverage.md
          echo "| File | % Lines | % Statements | % Branches | % Funcs |" >> src_coverage.md
          echo "|------|---------|--------------|------------|---------|" >> src_coverage.md

          # Run coverage using yarn script (handles Hats protocol patching)
          # Retry up to 3 times to handle transient RPC errors in fork tests
          MAX_RETRIES=3
          ATTEMPT=0
          COVERAGE_OK=false
          while [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Running yarn coverage:summary (attempt $ATTEMPT/$MAX_RETRIES)..."
            if yarn coverage:summary > full_coverage.txt 2>coverage_error.txt; then
              COVERAGE_OK=true
              break
            else
              echo "Attempt $ATTEMPT failed (exit code $?)"
              if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done

          if [ "$COVERAGE_OK" = true ]; then
            echo "Coverage completed successfully"

            # Process each src/ line and add emoji indicators
            grep "| src/" full_coverage.txt | while read -r line; do
              # Extract file path
              file=$(echo "$line" | awk -F'|' '{print $2}' | xargs)

              # Extract numerical percentages and full data
              lines_data=$(echo "$line" | awk -F'|' '{print $3}' | xargs)
              stmts_data=$(echo "$line" | awk -F'|' '{print $4}' | xargs)
              branch_data=$(echo "$line" | awk -F'|' '{print $5}' | xargs)
              funcs_data=$(echo "$line" | awk -F'|' '{print $6}' | xargs)

              # Extract just the percentage values (before the %)
              lines_pct=$(echo "$lines_data" | grep -o "^[0-9]\+\.[0-9]\+" || echo "0")
              stmts_pct=$(echo "$stmts_data" | grep -o "^[0-9]\+\.[0-9]\+" || echo "0")
              branch_pct=$(echo "$branch_data" | grep -o "^[0-9]\+\.[0-9]\+" || echo "0")
              funcs_pct=$(echo "$funcs_data" | grep -o "^[0-9]\+\.[0-9]\+" || echo "0")

              # Compare as integers by removing decimal part (95.00 becomes 95)
              lines_int=$(echo "$lines_pct" | cut -d. -f1)
              stmts_int=$(echo "$stmts_pct" | cut -d. -f1)
              branch_int=$(echo "$branch_pct" | cut -d. -f1)
              funcs_int=$(echo "$funcs_pct" | cut -d. -f1)

              # Add emojis using integer comparison (95% threshold)
              if [ "$lines_int" -lt 95 ]; then
                lines_formatted="🔴 $lines_data"
              else
                lines_formatted="✅ $lines_data"
              fi

              if [ "$stmts_int" -lt 95 ]; then
                stmts_formatted="🔴 $stmts_data"
              else
                stmts_formatted="✅ $stmts_data"
              fi

              if [ "$branch_int" -lt 95 ]; then
                branch_formatted="🔴 $branch_data"
              else
                branch_formatted="✅ $branch_data"
              fi

              if [ "$funcs_int" -lt 95 ]; then
                funcs_formatted="🔴 $funcs_data"
              else
                funcs_formatted="✅ $funcs_data"
              fi

              # Output the formatted line
              echo "| $file | $lines_formatted | $stmts_formatted | $branch_formatted | $funcs_formatted |" >> src_coverage.md
            done
          else
            echo "Coverage failed after $MAX_RETRIES attempts"
            echo "## ⚠️ Coverage Generation Failed" >> src_coverage.md
            echo "" >> src_coverage.md
            echo "Failed after $MAX_RETRIES attempts" >> src_coverage.md
            echo "" >> src_coverage.md
            echo "### Error output (stderr):" >> src_coverage.md
            echo '```' >> src_coverage.md
            cat coverage_error.txt >> src_coverage.md
            echo '```' >> src_coverage.md
            echo "" >> src_coverage.md
            echo "### Last 50 lines of stdout:" >> src_coverage.md
            echo '```' >> src_coverage.md
            tail -50 full_coverage.txt >> src_coverage.md
            echo '```' >> src_coverage.md
          fi

          # Always output what we have to GitHub step summary
          cat src_coverage.md >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Add PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: src_coverage.md

      - name: Enforce 95% Coverage Threshold
        run: |
          if [ ! -f full_coverage.txt ]; then
            echo "Coverage report not found, failing."
            exit 1
          fi

          THRESHOLD=95
          FAILED=0

          # Extract the total line from forge coverage output
          TOTAL_LINE=$(grep "^| Total" full_coverage.txt || true)
          if [ -z "$TOTAL_LINE" ]; then
            echo "Could not find totals in coverage report, failing."
            exit 1
          fi

          echo "Coverage totals: $TOTAL_LINE"

          LINES_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $3}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          STMTS_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $4}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          BRANCH_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $5}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          FUNCS_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $6}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)

          check_threshold() {
            local metric=$1
            local value=$2
            local int_value=$(echo "$value" | cut -d. -f1)
            if [ "$int_value" -lt "$THRESHOLD" ]; then
              echo "FAIL: $metric coverage is ${value}% (threshold: ${THRESHOLD}%)"
              return 1
            else
              echo "PASS: $metric coverage is ${value}%"
              return 0
            fi
          }

          check_threshold "Lines" "$LINES_PCT" || FAILED=1
          check_threshold "Statements" "$STMTS_PCT" || FAILED=1
          check_threshold "Branches" "$BRANCH_PCT" || FAILED=1
          check_threshold "Functions" "$FUNCS_PCT" || FAILED=1

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "Coverage is below the ${THRESHOLD}% threshold. Please add tests to increase coverage."
            exit 1
          fi

          echo ""
          echo "All coverage metrics meet the ${THRESHOLD}% threshold."

  kontrol-proofs:
    name: Kontrol Formal Verification
    runs-on: general
    continue-on-error: true
    container:
      image: runtimeverificationinc/kontrol:ubuntu-jammy-1.0.231
      options: --user root
    env:
      PYTHONPATH: /home/user/.local/lib/python3.10/site-packages
      XDG_CACHE_HOME: /home/user/.cache
      COLUMNS: "200"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Python environment
        run: rm -f /home/user/.local/lib/python3.10/site-packages/typing.py

      - name: Install Forge dependencies
        run: forge soldeer install

      - name: Kontrol Build
        run: kontrol build

      - name: Kontrol Prove
        run: kontrol prove --workers 8
        timeout-minutes: 240
