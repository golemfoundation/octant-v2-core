name: '🚀 Development Release'

on:
  push:
    branches:
      - develop

concurrency:
  group: version-release
  cancel-in-progress: false

env:
  X-GITHUB_ENVIRONMENT: &GITHUB_ENVIRONMENT actions
  X-node-extended-image: &node_extended_image ${{ vars.GCP_DOCKER_IMAGE_REGISTRY_DEV }}/node-extended:f4f41461

jobs:
  registry-token:
    name: Mint GAR access token
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      access_token: ${{ steps.gcp-token.outputs.access_token }}
    steps:
      - name: Mint GCP access token
        id: gcp-token
        uses: golemfoundation/github-actions/octant/gcp-wif-token@0.6.2
        with:
          wif-provider: ${{ vars.GCP_WIF_PROVIDER_DEV }}
          wif-service-account: ${{ vars.GCP_WIF_SA_DEV_READER }}

  create-release:
    name: Create release
    runs-on: ubuntu-latest
    environment: *GITHUB_ENVIRONMENT
    outputs:
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout source code
        uses: golemfoundation/github-actions/octant/git-checkout-lfs@0.4.9
        with:
          fetch-depth: 0
          token: ${{ secrets.HOUSEKEEPER_TOKEN }}

      - name: Setup Node.js and Yarn
        uses: golemfoundation/github-actions/octant/node-yarn-setup@0.4.9
        with:
          npm-auth-token: ${{ secrets.HOUSEKEEPER_PAT_OCTANT_V2_PACKAGES }}

      - name: Configure git
        uses: golemfoundation/github-actions/octant/git-configure@0.4.9
        with:
          gpg-key-base64: ${{ secrets.HOUSEKEEPER_SIGNING_KEY_B64 }}
          gpg-key-id: ${{ vars.HOUSEKEEPER_SIGNING_KEY_ID }}

      - name: Create release
        id: release
        uses: golemfoundation/github-actions/octant/release-dev-tag@0.4.9
        with:
          github-token: ${{ secrets.HOUSEKEEPER_TOKEN }}

  publish-package:
    name: Publish package
    needs:
      - registry-token
      - create-release
    runs-on: ubuntu-latest
    environment: *GITHUB_ENVIRONMENT
    permissions:
      contents: read
      id-token: write
    container:
      image: *node_extended_image
      credentials:
        username: oauth2accesstoken
        password: ${{ needs.registry-token.outputs.access_token }}
    steps:
      - name: Register GAR token mask
        run: echo "::add-mask::${{ needs.registry-token.outputs.access_token }}"

      - name: Checkout source code
        uses: golemfoundation/github-actions/octant/git-checkout-lfs@0.4.9
        with:
          ref: ${{ needs.create-release.outputs.tag-name }}

      - name: Setup Node.js and Yarn
        uses: golemfoundation/github-actions/octant/node-yarn-setup@0.4.9
        with:
          npm-auth-token: ${{ secrets.HOUSEKEEPER_PAT_OCTANT_V2_PACKAGES }}

      - name: Install Forge dependencies
        run: forge soldeer install

      - name: Publish package
        uses: golemfoundation/github-actions/octant/package-publish@0.4.9
        with:
          build-command: 'yarn build'
          tag: develop
