name: "⚙️ PR Standards Check"
on:
  pull_request:
    branches:
      - master
      - develop
    types:
      - opened
      - synchronize
      - reopened

env:
  X-node-extended-image: &node_extended_image ${{ vars.GCP_DOCKER_IMAGE_REGISTRY }}/node-extended:f4f41461

concurrency:
  group: "pr-${{ github.sha }}"
  cancel-in-progress: true

jobs:
  pr_preflight:
    name: PR Preflight
    if: github.head_ref != 'master'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      private_ci_supported: ${{ steps.check.outputs.private_ci_supported }}
    steps:
      - name: Check PR source and branch
        id: check
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          private_ci_supported=true
          expected_branches="feature/*, fix/*, bugfix/*, hotfix/*, release/*, chore/*, ci/*, docs/*, test/*, refactor/*, perf/*, or develop -> master production release"

          if [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            private_ci_supported=false
            echo "::error title=Unsupported PR source::PR Standards Check uses private container images. GitHub does not expose the required secrets to fork PRs. Push this branch to $BASE_REPOSITORY and open the PR from there."
          fi

          case "$HEAD_BRANCH" in
            feature/*|fix/*|bugfix/*|hotfix/*|release/*|chore/*|ci/*|docs/*|test/*|refactor/*|perf/*)
              ;;
            develop)
              if [ "$BASE_BRANCH" != "master" ]; then
                private_ci_supported=false
                echo "::error title=Unsupported branch name::Branch '$HEAD_BRANCH' is allowed only for production release PRs targeting master."
              fi
              ;;
            *)
              private_ci_supported=false
              echo "::error title=Unsupported branch name::Branch '$HEAD_BRANCH' does not match the expected naming convention: $expected_branches."
              ;;
          esac

          echo "private_ci_supported=$private_ci_supported" >> "$GITHUB_OUTPUT"

          if [ "$private_ci_supported" != true ]; then
            {
              echo "## PR preflight failed"
              echo ""
              echo "- Head repository: \`$HEAD_REPOSITORY\`"
              echo "- Base repository: \`$BASE_REPOSITORY\`"
              echo "- Head branch: \`$HEAD_BRANCH\`"
              echo "- Base branch: \`$BASE_BRANCH\`"
              echo "- Expected branch names: \`$expected_branches\`"
              echo ""
              echo "Private-container CI can run only for branches in the base repository because fork PRs do not receive the required secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  check-formatting:
    name: Check Code Formatting
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Init env
        run: yarn install

      - name: Check formatting
        run: yarn format:check

  lint:
    name: Lint Code
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Init env
        run: yarn install

      - name: Run linter
        run: yarn lint

  conventional-commits:
    name: Conventional Commits
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Check conventional commits
        uses: golemfoundation/github-actions/octant/conventional-commits-check@0.4.9
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  build:
    name: Build
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Build
        run: yarn build

  test:
    name: Test suite
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 15
    runs-on: general
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Run tests
        env:
          TEST_RPC_URL: "${{ vars.TEST_MAINNET_RPC_URL }}"
          TEST_SAFE_SINGLETON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
          TEST_RPC_URL_POLYGON: "${{ vars.TEST_POLYGON_RPC_URL }}"
          TEST_SAFE_SINGLETON_POLYGON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY_POLYGON: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
        run: yarn test:ci

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: reports/junit.xml

      - name: Prepare test report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        continue-on-error: true
        with:
          artifact: test-results
          name: Tests results
          path: "*.xml"
          reporter: java-junit

  coverage:
    name: Code Coverage
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 30
    runs-on: general
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Generate Coverage Report
        env:
          TEST_RPC_URL: "${{ vars.TEST_MAINNET_RPC_URL }}"
          TEST_SAFE_SINGLETON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
          TEST_RPC_URL_POLYGON: "${{ vars.TEST_POLYGON_RPC_URL }}"
          TEST_SAFE_SINGLETON_POLYGON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY_POLYGON: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
        run: |
          echo "# Code Coverage Report for src/ files" > src_coverage.md
          echo "" >> src_coverage.md
          echo "| File | % Lines | % Statements | % Branches | % Funcs |" >> src_coverage.md
          echo "|------|---------|--------------|------------|---------|" >> src_coverage.md

          MAX_RETRIES=3
          ATTEMPT=0
          COVERAGE_OK=false
          while [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Running yarn coverage:summary (attempt $ATTEMPT/$MAX_RETRIES)..."
            if yarn coverage:summary > full_coverage.txt 2>coverage_error.txt; then
              COVERAGE_OK=true
              break
            else
              echo "Attempt $ATTEMPT failed (exit code $?)"
              if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done

          if [ "$COVERAGE_OK" = true ]; then
            echo "Coverage completed successfully"
            grep "| src/" full_coverage.txt | while read -r line; do
              file=$(echo "$line" | awk -F'|' '{print $2}' | xargs)
              lines_data=$(echo "$line" | awk -F'|' '{print $3}' | xargs)
              stmts_data=$(echo "$line" | awk -F'|' '{print $4}' | xargs)
              branch_data=$(echo "$line" | awk -F'|' '{print $5}' | xargs)
              funcs_data=$(echo "$line" | awk -F'|' '{print $6}' | xargs)
              lines_int=$(echo "$lines_data" | grep -o "^[0-9]\+\.[0-9]\+" | cut -d. -f1 || echo "0")
              stmts_int=$(echo "$stmts_data" | grep -o "^[0-9]\+\.[0-9]\+" | cut -d. -f1 || echo "0")
              branch_int=$(echo "$branch_data" | grep -o "^[0-9]\+\.[0-9]\+" | cut -d. -f1 || echo "0")
              funcs_int=$(echo "$funcs_data" | grep -o "^[0-9]\+\.[0-9]\+" | cut -d. -f1 || echo "0")
              [ "$lines_int" -lt 95 ] && lines_data="🔴 $lines_data" || lines_data="✅ $lines_data"
              [ "$stmts_int" -lt 95 ] && stmts_data="🔴 $stmts_data" || stmts_data="✅ $stmts_data"
              [ "$branch_int" -lt 95 ] && branch_data="🔴 $branch_data" || branch_data="✅ $branch_data"
              [ "$funcs_int" -lt 95 ] && funcs_data="🔴 $funcs_data" || funcs_data="✅ $funcs_data"
              echo "| $file | $lines_data | $stmts_data | $branch_data | $funcs_data |" >> src_coverage.md
            done
          else
            echo "Coverage failed after $MAX_RETRIES attempts"
            echo "## ⚠️ Coverage Generation Failed" >> src_coverage.md
            echo "" >> src_coverage.md
            echo "Failed after $MAX_RETRIES attempts" >> src_coverage.md
            echo '```' >> src_coverage.md
            cat coverage_error.txt >> src_coverage.md
            echo '```' >> src_coverage.md
            echo '```' >> src_coverage.md
            tail -50 full_coverage.txt >> src_coverage.md
            echo '```' >> src_coverage.md
          fi
          cat src_coverage.md >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Add PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: src_coverage.md

      - name: Enforce 95% Coverage Threshold
        run: |
          if [ ! -f full_coverage.txt ]; then
            echo "Coverage report not found, failing."
            exit 1
          fi
          THRESHOLD=95
          FAILED=0
          TOTAL_LINE=$(grep "^| Total" full_coverage.txt || true)
          if [ -z "$TOTAL_LINE" ]; then
            echo "Could not find totals in coverage report, failing."
            exit 1
          fi
          echo "Coverage totals: $TOTAL_LINE"
          LINES_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $3}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          STMTS_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $4}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          BRANCH_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $5}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          FUNCS_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $6}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          check_threshold() {
            local metric=$1 value=$2 int_value=$(echo "$2" | cut -d. -f1)
            if [ "$int_value" -lt "$THRESHOLD" ]; then
              echo "FAIL: $metric coverage is ${value}% (threshold: ${THRESHOLD}%)"
              return 1
            else
              echo "PASS: $metric coverage is ${value}%"
              return 0
            fi
          }
          check_threshold "Lines" "$LINES_PCT" || FAILED=1
          check_threshold "Statements" "$STMTS_PCT" || FAILED=1
          check_threshold "Branches" "$BRANCH_PCT" || FAILED=1
          check_threshold "Functions" "$FUNCS_PCT" || FAILED=1
          if [ "$FAILED" -eq 1 ]; then
            echo "Coverage is below the ${THRESHOLD}% threshold."
            exit 1
          fi
          echo "All coverage metrics meet the ${THRESHOLD}% threshold."

  kontrol-proofs:
    name: Kontrol Formal Verification
    needs: pr_preflight
    # Run the expensive proofs only on the canonical develop -> master release PR path.
    if: >-
      needs.pr_preflight.outputs.private_ci_supported == 'true' &&
      github.base_ref == 'master' &&
      github.head_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: general
    container:
      image: runtimeverificationinc/kontrol:ubuntu-jammy-1.0.231
      options: --user root
    env:
      PYTHONPATH: /home/user/.local/lib/python3.10/site-packages
      XDG_CACHE_HOME: /home/user/.cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix Python environment
        run: rm -f /home/user/.local/lib/python3.10/site-packages/typing.py

      - name: Install Forge dependencies
        run: |
          for attempt in 1 2 3; do
            if forge soldeer install; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "forge soldeer install failed on attempt ${attempt}/3; retrying..."
              sleep $((attempt * 10))
            fi
          done

          echo "forge soldeer install failed after 3 attempts"
          exit 1

      - name: Kontrol Build
        run: kontrol build

      - name: Kontrol Prove
        env:
          COLUMNS: "220"
          LINES: "60"
          TERM: xterm-256color
          PYTHONUNBUFFERED: "1"
        run: |
          kontrol prove --workers 4 --hide-status-bar
        timeout-minutes: 240

  analyze:
    name: Analyze with Slither
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Run Slither
        shell: "bash {0}"
        run: |
          yarn slither:ci
          exit_code=$?
          echo '```' > $GITHUB_STEP_SUMMARY
          cat reports/slither.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $exit_code

  trivy:
    name: Vulnerability Scan
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Trivy Scan
        uses: golemfoundation/github-actions/octant/trivy-scan@0.4.9

  natspec:
    name: NatSpec Documentation Check
    needs: pr_preflight
    if: needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Generate documentation
        run: FOUNDRY_DENY_WARNINGS=false forge doc

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natspec-documentation
          path: docs/

      - name: Check NatSpec coverage
        run: bash script/check-natspec.sh

  semver-check:
    name: Contract Semver Check
    needs: [pr_preflight, kontrol-proofs]
    if: >-
      always() &&
      needs.pr_preflight.outputs.private_ci_supported == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Require Kontrol proofs
        if: >-
          github.base_ref == 'master' &&
          github.head_ref == 'develop' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ "${{ needs.kontrol-proofs.result }}" != "success" ]; then
            echo "Kontrol proofs must pass before merging develop into master."
            echo "Kontrol result: ${{ needs.kontrol-proofs.result }}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init env
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          yarn install
          forge soldeer install

      - name: Check semantic version bumps in changed contracts
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(git merge-base "$BASE_REF" "$HEAD_REF")
          node scripts/sol-semver.mjs check \
            --old-ref "$MERGE_BASE" \
            --new-ref "$HEAD_REF"
