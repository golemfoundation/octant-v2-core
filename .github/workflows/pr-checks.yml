name: '⚙️ PR Standards Check'
on:
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
      - reopened

env:
  X-node-extended-image: &node_extended_image ${{ vars.GCP_DOCKER_IMAGE_REGISTRY }}/node-extended:f4f41461

concurrency:
  group: "pr-${{ github.sha }}"
  cancel-in-progress: true

jobs:
  check-formatting:
    name: Check Code Formatting
    if: github.head_ref != 'main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Init env
        run: yarn install

      - name: Check formatting
        run: yarn format:check

  lint:
    name: Lint Code
    if: github.head_ref != 'main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Init env
        run: yarn install

      - name: Run linter
        run: yarn lint

  conventional-commits:
    name: Conventional Commits
    if: github.head_ref != 'main'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Check conventional commits
        uses: golemfoundation/github-actions/octant/conventional-commits-check@0.4.7
        with:
          base-ref: origin/${{ github.base_ref }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  build:
    name: Build
    if: github.head_ref != 'main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Build
        run: yarn build

  test:
    name: Test suite
    if: github.head_ref != 'main'
    timeout-minutes: 15
    runs-on: general
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Run tests
        env:
          TEST_RPC_URL: "${{ vars.TEST_MAINNET_RPC_URL }}"
          TEST_SAFE_SINGLETON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
          TEST_RPC_URL_POLYGON: "${{ vars.TEST_POLYGON_RPC_URL }}"
          TEST_SAFE_SINGLETON_POLYGON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY_POLYGON: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
        run: yarn test:ci

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: reports/junit.xml

      - name: Prepare test report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        continue-on-error: true
        with:
          artifact: test-results
          name: Tests results
          path: "*.xml"
          reporter: java-junit

  coverage:
    name: Code Coverage
    if: github.head_ref != 'main'
    timeout-minutes: 30
    runs-on: general
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Generate Coverage Report
        env:
          TEST_RPC_URL: "${{ vars.TEST_MAINNET_RPC_URL }}"
          TEST_SAFE_SINGLETON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
          TEST_RPC_URL_POLYGON: "${{ vars.TEST_POLYGON_RPC_URL }}"
          TEST_SAFE_SINGLETON_POLYGON: "0x41675C099F32341bf84BFc5382aF534df5C7461a"
          TEST_SAFE_PROXY_FACTORY_POLYGON: "0x4e1DCf7AD4e460CfD30791CCC4F9c8a4f820ec67"
        run: |
          echo "# Code Coverage Report for src/ files" > src_coverage.md
          echo "" >> src_coverage.md
          echo "| File | % Lines | % Statements | % Branches | % Funcs |" >> src_coverage.md
          echo "|------|---------|--------------|------------|---------|" >> src_coverage.md

          MAX_RETRIES=3
          ATTEMPT=0
          COVERAGE_OK=false
          while [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Running yarn coverage:summary (attempt $ATTEMPT/$MAX_RETRIES)..."
            if yarn coverage:summary > full_coverage.txt 2>coverage_error.txt; then
              COVERAGE_OK=true
              break
            else
              echo "Attempt $ATTEMPT failed (exit code $?)"
              if [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
                echo "Retrying in 10 seconds..."
                sleep 10
              fi
            fi
          done

          if [ "$COVERAGE_OK" = true ]; then
            echo "Coverage completed successfully"
            grep "| src/" full_coverage.txt | while read -r line; do
              file=$(echo "$line" | awk -F'|' '{print $2}' | xargs)
              lines_data=$(echo "$line" | awk -F'|' '{print $3}' | xargs)
              stmts_data=$(echo "$line" | awk -F'|' '{print $4}' | xargs)
              branch_data=$(echo "$line" | awk -F'|' '{print $5}' | xargs)
              funcs_data=$(echo "$line" | awk -F'|' '{print $6}' | xargs)
              lines_int=$(echo "$lines_data" | grep -o "^[0-9]\+\.[0-9]\+" | cut -d. -f1 || echo "0")
              stmts_int=$(echo "$stmts_data" | grep -o "^[0-9]\+\.[0-9]\+" | cut -d. -f1 || echo "0")
              branch_int=$(echo "$branch_data" | grep -o "^[0-9]\+\.[0-9]\+" | cut -d. -f1 || echo "0")
              funcs_int=$(echo "$funcs_data" | grep -o "^[0-9]\+\.[0-9]\+" | cut -d. -f1 || echo "0")
              [ "$lines_int" -lt 95 ] && lines_data="🔴 $lines_data" || lines_data="✅ $lines_data"
              [ "$stmts_int" -lt 95 ] && stmts_data="🔴 $stmts_data" || stmts_data="✅ $stmts_data"
              [ "$branch_int" -lt 95 ] && branch_data="🔴 $branch_data" || branch_data="✅ $branch_data"
              [ "$funcs_int" -lt 95 ] && funcs_data="🔴 $funcs_data" || funcs_data="✅ $funcs_data"
              echo "| $file | $lines_data | $stmts_data | $branch_data | $funcs_data |" >> src_coverage.md
            done
          else
            echo "Coverage failed after $MAX_RETRIES attempts"
            echo "## ⚠️ Coverage Generation Failed" >> src_coverage.md
            echo "" >> src_coverage.md
            echo "Failed after $MAX_RETRIES attempts" >> src_coverage.md
            echo '```' >> src_coverage.md
            cat coverage_error.txt >> src_coverage.md
            echo '```' >> src_coverage.md
            echo '```' >> src_coverage.md
            tail -50 full_coverage.txt >> src_coverage.md
            echo '```' >> src_coverage.md
          fi
          cat src_coverage.md >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      - name: Add PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-report
          path: src_coverage.md

      - name: Enforce 95% Coverage Threshold
        run: |
          if [ ! -f full_coverage.txt ]; then
            echo "Coverage report not found, failing."
            exit 1
          fi
          THRESHOLD=95
          FAILED=0
          TOTAL_LINE=$(grep "^| Total" full_coverage.txt || true)
          if [ -z "$TOTAL_LINE" ]; then
            echo "Could not find totals in coverage report, failing."
            exit 1
          fi
          echo "Coverage totals: $TOTAL_LINE"
          LINES_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $3}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          STMTS_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $4}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          BRANCH_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $5}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          FUNCS_PCT=$(echo "$TOTAL_LINE" | awk -F'|' '{print $6}' | grep -o "[0-9]\+\.[0-9]\+" | head -1)
          check_threshold() {
            local metric=$1 value=$2 int_value=$(echo "$2" | cut -d. -f1)
            if [ "$int_value" -lt "$THRESHOLD" ]; then
              echo "FAIL: $metric coverage is ${value}% (threshold: ${THRESHOLD}%)"
              return 1
            else
              echo "PASS: $metric coverage is ${value}%"
              return 0
            fi
          }
          check_threshold "Lines" "$LINES_PCT" || FAILED=1
          check_threshold "Statements" "$STMTS_PCT" || FAILED=1
          check_threshold "Branches" "$BRANCH_PCT" || FAILED=1
          check_threshold "Functions" "$FUNCS_PCT" || FAILED=1
          if [ "$FAILED" -eq 1 ]; then
            echo "Coverage is below the ${THRESHOLD}% threshold."
            exit 1
          fi
          echo "All coverage metrics meet the ${THRESHOLD}% threshold."

  analyze:
    name: Analyze with Slither
    if: github.head_ref != 'main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Run Slither
        shell: "bash {0}"
        run: |
          yarn slither:ci
          exit_code=$?
          echo '```' > $GITHUB_STEP_SUMMARY
          cat reports/slither.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $exit_code

  trivy:
    name: Vulnerability Scan
    if: github.head_ref != 'main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Trivy Scan
        uses: golemfoundation/github-actions/octant/trivy-scan@0.4.7

  natspec:
    name: NatSpec Documentation Check
    if: github.head_ref != 'main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init env
        run: |
          yarn install
          forge soldeer install

      - name: Generate documentation
        run: FOUNDRY_DENY_WARNINGS=false forge doc

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natspec-documentation
          path: docs/

      - name: Check NatSpec coverage
        run: bash script/check-natspec.sh

  semver-check:
    name: Contract Semver Check
    if: github.head_ref != 'main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: *node_extended_image
      credentials:
        username: _json_key_base64
        password: ${{ secrets.GCP_DOCKER_IMAGES_REGISTRY_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init env
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          yarn install
          forge soldeer install

      - name: Check semantic version bumps in changed contracts
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(git merge-base "$BASE_REF" "$HEAD_REF")
          node scripts/sol-semver.mjs check \
            --old-ref "$MERGE_BASE" \
            --new-ref "$HEAD_REF"
